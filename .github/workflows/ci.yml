name: CI

# Installs Frappe + ERPNext + HRMS (all pinned to the v16 branches), creates a disposable test
# site and runs the full test suite of the app with `bench run-tests`. Mirrors the official
# frappe/erpnext + frappe/hrms version-16 CI (Python 3.14, Node 24, MariaDB 11.8).

on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FRAPPE_BRANCH: version-16
  ERPNEXT_BRANCH: version-16
  HRMS_BRANCH: version-16
  PAYMENTS_BRANCH: version-16 # payments develop requires frappe v17; version-16 matches the v16 stack

jobs:
  tests:
    name: Server tests (treasury)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=10

    steps:
      - name: Clone treasury
        uses: actions/checkout@v6
        with:
          path: src/treasury

      - name: Clone custody-next (private; read-only deploy key)
        uses: actions/checkout@v6
        with:
          repository: a7733mai/custody-next
          ref: main
          ssh-key: ${{ secrets.CUSTODY_NEXT_DEPLOY_KEY }}
          path: src/custody

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Add to Hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get remove -y mysql-server mysql-client || true
          sudo apt-get install -y libcups2-dev redis-server mariadb-client libmariadb-dev pkg-config

      - name: Create bench
        run: |
          pip install frappe-bench
          bench init --skip-assets --frappe-branch "$FRAPPE_BRANCH" --python "$(which python)" ~/frappe-bench
          cd ~/frappe-bench
          # no scheduler / watcher / socketio needed for tests
          sed -i 's/watch:/# watch:/g' Procfile
          sed -i 's/schedule:/# schedule:/g' Procfile
          sed -i 's/socketio:/# socketio:/g' Procfile
          sed -i 's/redis_socketio:/# redis_socketio:/g' Procfile

      - name: Get apps
        working-directory: /home/runner/frappe-bench
        env:
          CI: 'Yes'
        run: |
          bench get-app payments --branch "$PAYMENTS_BRANCH"
          bench get-app erpnext --branch "$ERPNEXT_BRANCH"
          bench get-app hrms --branch "$HRMS_BRANCH"
          bench get-app custody "$GITHUB_WORKSPACE/src/custody"
          bench get-app treasury "$GITHUB_WORKSPACE/src/treasury"
          bench setup requirements --dev
          echo "## Versions under test" >> "$GITHUB_STEP_SUMMARY"
          for a in frappe payments erpnext hrms custody; do
            echo "- $a: $(git -C apps/$a rev-parse HEAD) ($(git -C apps/$a rev-parse --abbrev-ref HEAD))" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Start bench services (redis)
        working-directory: /home/runner/frappe-bench
        run: |
          bench start >> bench_start.log 2>&1 &
          for i in $(seq 1 60); do
            (exec 3<>/dev/tcp/127.0.0.1/13000) 2>/dev/null && break
            sleep 1
          done

      - name: Create site and install apps
        working-directory: /home/runner/frappe-bench
        run: |
          mariadb --host 127.0.0.1 -u root -proot -e "SET GLOBAL character_set_server='utf8mb4'; SET GLOBAL collation_server='utf8mb4_unicode_ci'"
          bench new-site test_site --db-host 127.0.0.1 --db-root-username root --db-root-password root             --mariadb-user-host-login-scope='%' --admin-password admin --install-app erpnext
          bench --site test_site install-app hrms
          bench --site test_site install-app custody
          # CI workaround (app defect, see baseline report): `install-app treasury` fails in init_singles because
          # Treasury Settings defaults to the Supplier Group "Treasury Payees", which treasury's after_install
          # creates only afterwards. Pre-create it so install and tests can proceed on unchanged app code.
          bench --site test_site console <<'PY'
          import frappe
          if not frappe.db.exists("Supplier Group", "Treasury Payees"):
              frappe.get_doc({"doctype": "Supplier Group", "supplier_group_name": "Treasury Payees", "parent_supplier_group": "All Supplier Groups"}).insert(ignore_permissions=True)
              frappe.db.commit()
          PY
          bench --site test_site install-app treasury
          bench --site test_site set-config -p allow_tests True
          bench --site test_site set-config -p throttle_user_limit 100

      - name: Run tests (treasury)
        working-directory: /home/runner/frappe-bench
        env:
          TYPE: server
        run: |
          set +e
          START=$(date +%s)
          bench --site test_site run-tests --app treasury 2>&1 | tee test-run.log
          RC=${PIPESTATUS[0]}
          echo "run-tests exit code: $RC; runtime: $(($(date +%s)-START))s" | tee -a test-run.log
          {
            echo "## Test result (treasury)"
            echo "exit code: $RC, runtime: $(($(date +%s)-START))s"
            echo '```'
            tail -n 15 test-run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RC

      - name: Upload test log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-run-log
          path: |
            /home/runner/frappe-bench/test-run.log
            /home/runner/frappe-bench/bench_start.log
          if-no-files-found: ignore
